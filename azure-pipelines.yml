trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UseNode@1
    inputs:
      version: '20.x'
      checkLatest: true
  
  - script: |
      npm install
    displayName: 'Install dependencies'
  
  - script: |
      npm run lint
    displayName: 'Lint'